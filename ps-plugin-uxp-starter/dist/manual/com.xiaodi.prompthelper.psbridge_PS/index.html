<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小迪助词器 Ps 插件</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="brand">
          <img class="brand-logo" src="./assets/brand-logo.svg" alt="小迪助词器 Logo" />
          <div class="title">小迪助词器 Ps 插件</div>
        </div>
      </header>

      <section class="panel-card">
        <div class="section-title">插件端口</div>
        <div class="inline-row">
          <input id="bridgePort" type="number" value="17325" />
          <button id="applyPortBtn" type="button">保存</button>
        </div>
        <div class="hint">用于连接软件端 bridge（默认 17325）。</div>
      </section>

      <div class="divider" aria-hidden="true"></div>

      <section class="panel-card logs-card">
        <div class="status-line">
          <div class="section-title">插件日志</div>
          <button id="clearLogsBtn" type="button" class="btn-quiet">清空</button>
        </div>
        <div id="logSinkHint" class="hint"></div>
        <pre id="pluginLogPanel" class="plugin-log-panel"></pre>
      </section>
    </main>

    <script src="./index.js"></script>
  </body>
</html>
